  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { font-size: 15px; }\n\n:root {\n  --navy:         #1D314A;\n  --blue:         #315876;\n  --orange:       #E67E22;\n  --orange-light: #F39C55;\n  --mist:         #F4F7FF;\n  --steel:        #46505A;\n  --green:        #1a6b4a;\n  --border:       #dde3ec;\n  --text:         #1e293b;\n  --text-sm:      #4a5568;\n  --teal:         #0F6E56;\n  --amber:        #92400e;\n}\n\nbody {\n  font-family: 'Source Sans 3', 'Segoe UI', sans-serif;\n  background: #eef1f7;\n  color: var(--text);\n  line-height: 1.55;\n  padding: 24px 12px;\n}\n\n/* ── PAGE (letter portrait, 8.5\" × 11\") ── */\n.page {\n  width: 8.5in;\n  min-height: 11in;\n  margin: 0 auto 24px;\n  background: #fff;\n  box-shadow: 0 4px 32px rgba(0,0,0,.10);\n  padding: 0.55in 0.6in 0.55in;\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n}\n.page.page-hero { padding: 0; }\n.page.page-hero .page-inner { padding: 20px 0.6in 0.55in; display: flex; flex-direction: column; flex: 1; }\n\n/* ── HERO (page 1) ── */\n.hero {\n  background: linear-gradient(140deg, #1D314A 0%, #2a4a6e 60%, #315876 100%);\n  color: #fff;\n  padding: 40px 0.6in 36px;\n  position: relative;\n  overflow: hidden;\n}\n.hero-disk {\n  position: absolute;\n  top: -80px; right: -80px;\n  width: 240px; height: 240px;\n  border-radius: 50%;\n  background: rgba(244,247,255,0.93);\n  overflow: hidden;\n  box-shadow: 0 0 0 10px rgba(255,255,255,0.07), 0 0 0 20px rgba(255,255,255,0.03);\n}\n.hero-disk svg { position: absolute; width: 130px; height: 130px; left: 30px; top: 82px; }\n.hero-eyebrow {\n  font-size: 10px; font-weight: 700;\n  letter-spacing: 0.16em; text-transform: uppercase;\n  color: #E67E22; margin-bottom: 14px;\n  position: relative; z-index: 2;\n}\n.hero-title {\n  font-size: 38px; font-weight: 800;\n  line-height: 1; letter-spacing: -0.02em;\n  margin-bottom: 10px; position: relative; z-index: 2;\n  color: #fff;\n  font-family: 'Source Sans 3', 'Segoe UI', sans-serif;\n}\n.hero-title em { font-style: normal; color: #E67E22; }\n.hero-subtitle {\n  font-size: 14px; color: rgba(255,255,255,0.75);\n  line-height: 1.6; max-width: 520px;\n  position: relative; z-index: 2; font-weight: 400;\n}\n\n/* ── INTRO CARD (orange left border, overlaps hero) ── */\n.intro-card {\n  margin: -20px 0.6in 0;\n  background: #fff;\n  border: 1px solid #e2e8f0;\n  border-left: 4px solid #E67E22;\n  border-radius: 0 10px 10px 0;\n  padding: 14px 20px;\n  box-shadow: 0 6px 20px rgba(29,49,74,0.10);\n  position: relative; z-index: 3;\n  font-size: 13px; color: #46505A; line-height: 1.55;\n}\n.intro-card strong { color: #1D314A; font-weight: 700; }\n\n/* ── META ROW ── */\n.meta-row {\n  display: flex; gap: 24px;\n  padding: 18px 0.6in 14px;\n  border-bottom: 1px solid #e2e8f0;\n}\n.meta-col { flex: 1; }\n.meta-lbl {\n  font-size: 9px; font-weight: 700;\n  letter-spacing: 0.14em; text-transform: uppercase;\n  color: #94a3b8; margin-bottom: 4px;\n}\n.meta-val {\n  font-size: 12.5px; font-weight: 600;\n  color: #1D314A; line-height: 1.4;\n}\n\n/* ── CLIENT FIELDS ── */\n.client-row {\n  display: flex; gap: 28px;\n  padding: 14px 0.6in 18px;\n  border-bottom: 1px solid #e2e8f0;\n}\n.client-field { flex: 1; }\n.client-lbl {\n  font-size: 9px; font-weight: 700;\n  letter-spacing: 0.14em; text-transform: uppercase;\n  color: #94a3b8; margin-bottom: 6px;\n}\n.client-line { height: 26px; border-bottom: 1px solid #cbd5e1; }\n\n/* ── SECTION TITLE ── */\n.section-title {\n  font-family: 'Playfair Display', serif;\n  font-size: 16px;\n  font-weight: 600;\n  color: var(--navy);\n  margin: 18px 0 10px;\n  padding-bottom: 7px;\n  border-bottom: 2px solid var(--border);\n}\n.section-title:first-child { margin-top: 0; }\n\n.section-intro {\n  font-size: 12.5px;\n  color: var(--text-sm);\n  margin-bottom: 12px;\n  line-height: 1.55;\n}\n\n/* ── DEFINITION BOX ── */\n.definition-box {\n  background: var(--navy);\n  color: #fff;\n  border-radius: 8px;\n  padding: 16px 20px;\n  margin-bottom: 14px;\n}\n.definition-box p {\n  font-size: 13.5px;\n  line-height: 1.6;\n  opacity: .92;\n}\n.definition-box p strong {\n  color: var(--orange-light);\n  font-weight: 700;\n  opacity: 1;\n}\n\n/* ── NOT-BOX (removed from page; styles retained for reference) ── */\n.not-box {\n  display: none;\n  background: rgba(146,64,14,.06);\n  border: 1px solid rgba(146,64,14,.2);\n  border-radius: 8px;\n  padding: 12px 18px;\n  margin-bottom: 14px;\n}\n.not-box-title {\n  font-size: 10.5px;\n  font-weight: 700;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: var(--amber);\n  margin-bottom: 7px;\n}\n.not-box ul {\n  list-style: none;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 5px 14px;\n}\n.not-box ul li {\n  font-size: 12px;\n  color: #633806;\n  padding-left: 16px;\n  position: relative;\n  line-height: 1.4;\n}\n.not-box ul li::before {\n  content: '✕';\n  position: absolute;\n  left: 0;\n  font-weight: 700;\n  font-size: 10.5px;\n  color: #BA7517;\n}\n\n/* ── RESPONSIBILITY CARDS ── */\n.resp-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n  margin-bottom: 14px;\n}\n.resp-card {\n  border: 1px solid var(--border);\n  border-radius: 8px;\n  overflow: hidden;\n  break-inside: avoid;\n}\n.resp-card-header {\n  background: var(--mist);\n  border-bottom: 1px solid var(--border);\n  padding: 9px 13px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n.resp-num {\n  width: 22px; height: 22px;\n  border-radius: 50%;\n  background: var(--teal);\n  color: #fff;\n  font-size: 11px;\n  font-weight: 700;\n  display: flex; align-items: center; justify-content: center;\n  flex-shrink: 0;\n}\n.resp-card-title {\n  font-size: 12.5px;\n  font-weight: 700;\n  color: var(--navy);\n  line-height: 1.3;\n}\n.resp-card-body {\n  padding: 11px 13px;\n  font-size: 12px;\n  color: var(--text-sm);\n  line-height: 1.55;\n}\n.resp-card-body strong { color: var(--text); font-weight: 700; }\n\n/* ── CADENCE TABLE ── */\n.cadence-table {\n  width: 100%;\n  border-collapse: collapse;\n  font-size: 12px;\n  margin-bottom: 14px;\n}\n.cadence-table th {\n  background: var(--navy);\n  color: #fff;\n  font-weight: 700;\n  font-size: 9.5px;\n  letter-spacing: .09em;\n  text-transform: uppercase;\n  padding: 6px 11px;\n  text-align: left;\n}\n.cadence-table th:first-child { border-radius: 5px 0 0 0; }\n.cadence-table th:last-child  { border-radius: 0 5px 0 0; }\n.cadence-table td {\n  padding: 6px 11px;\n  border-bottom: 1px solid var(--border);\n  vertical-align: top;\n  line-height: 1.4;\n  color: var(--text-sm);\n  font-size: 11px;\n}\n.cadence-table tr:last-child td { border-bottom: 2px solid var(--navy); }\n.cadence-table tr:nth-child(even) td { background: var(--mist); }\n.cadence-table td.freq {\n  font-weight: 700;\n  color: var(--teal);\n  white-space: nowrap;\n  width: 95px;\n}\n.cadence-table td.task {\n  font-weight: 600;\n  color: var(--navy);\n  width: 155px;\n}\n\n/* ── APPROVAL FLOW ── */\n.approval-flow {\n  display: flex;\n  align-items: stretch;\n  gap: 0;\n  margin-bottom: 10px;\n  flex-wrap: nowrap;\n}\n.flow-step {\n  background: var(--mist);\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  padding: 8px 8px 9px;\n  flex: 1;\n  min-width: 0;\n  text-align: center;\n}\n.flow-step-num {\n  font-size: 9.5px;\n  font-weight: 700;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--teal);\n  margin-bottom: 4px;\n}\n.flow-step-label {\n  font-size: 12px;\n  font-weight: 700;\n  color: var(--navy);\n  line-height: 1.25;\n}\n.flow-step-note {\n  font-size: 10.5px;\n  color: var(--text-sm);\n  margin-top: 4px;\n  font-style: italic;\n  line-height: 1.35;\n}\n.flow-arrow {\n  font-size: 16px;\n  color: var(--orange);\n  padding: 0 6px;\n  font-weight: 700;\n  align-self: center;\n  flex-shrink: 0;\n}\n\n/* ── ASSIGNMENT BOX ── */\n.assignment-box {\n  background: linear-gradient(135deg, #fff8f2, #fff3e8);\n  border: 1px solid rgba(230,126,34,.25);\n  border-radius: 8px;\n  padding: 11px 16px 13px;\n  margin-bottom: 10px;\n}\n.assignment-box-title {\n  font-size: 10.5px;\n  font-weight: 700;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: var(--orange);\n  margin-bottom: 10px;\n}\n.assignment-fields {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 8px 18px;\n}\n.assignment-field label {\n  font-size: 9.5px;\n  font-weight: 700;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--text-sm);\n  display: block;\n  margin-bottom: 4px;\n}\n.assignment-field .field-line {\n  border: none;\n  border-bottom: 1px solid #d4a97a;\n  height: 20px;\n  width: 100%;\n  display: block;\n  background: transparent;\n}\n\n/* ── CONTACT CARD ── */\n.contact-card {\n  background: var(--mist);\n  border-left: 3px solid var(--blue);\n  border-radius: 0 6px 6px 0;\n  padding: 9px 14px;\n  font-size: 11.5px;\n  color: var(--steel);\n  line-height: 1.45;\n  margin-bottom: 8px;\n}\n.contact-card strong { font-weight: 700; color: var(--navy); }\n\n/* ── CHECKLIST (page 3) ── */\n.checklist {\n  list-style: none;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 8px 18px;\n  margin-bottom: 14px;\n}\n.checklist li {\n  display: flex;\n  align-items: flex-start;\n  gap: 10px;\n  font-size: 12.5px;\n  color: var(--text);\n  line-height: 1.45;\n  padding: 8px 10px;\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: #fff;\n}\n.checklist .cb {\n  width: 14px;\n  height: 14px;\n  border: 1.5px solid var(--navy);\n  border-radius: 3px;\n  flex-shrink: 0;\n  margin-top: 2px;\n  background: #fff;\n}\n\n/* ── NOTES LINES ── */\n.notes-block {\n  margin-top: 4px;\n}\n.notes-line {\n  border-bottom: 1px solid #cdd4de;\n  height: 24px;\n  width: 100%;\n}\n.notes-line + .notes-line { margin-top: 6px; }\n\n/* ── FOOTER (per page) ── */\n.page-footer {\n  margin-top: auto;\n  padding-top: 12px;\n  border-top: 1px solid var(--border);\n  font-size: 9.5px;\n  color: #8a94a4;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}\n.page-footer .brand { font-weight: 700; color: var(--navy); letter-spacing: .1em; }\n\n/* ── PRINT ── */\n@media print {\n  @page { size: letter portrait; margin: 0; }\n  html, body { background: #fff; padding: 0; margin: 0; }\n  .page {\n    margin: 0 !important;\n    box-shadow: none !important;\n    page-break-after: always;\n    break-after: page;\n    width: 8.5in !important;\n    height: 11in !important;\n    min-height: 11in !important;\n    max-height: 11in !important;\n    overflow: hidden !important;\n  }\n  .page:last-child { page-break-after: auto; break-after: auto; }\n  .resp-card, .not-box, .definition-box, .assignment-box, .approval-flow, .cadence-table, .intent-bar, .meta-row, .client-row, .hero { break-inside: avoid; }\n}\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ═══════════════════════════════════════════════════════════════════════════\n     PAGE 1 — What it is, what it isn't, the four responsibilities\n═══════════════════════════════════════════════════════════════════════════ -->\n<div class=\"page page-hero\">\n\n  <div class=\"hero\">\n    <div class=\"hero-disk\">\n      <svg viewBox=\"36 -4 256 221\">\n        <rect fill=\"#315876\" x=\"60\" y=\"55\" width=\"16\" height=\"110\"><\u002Frect>\n        <rect fill=\"#315876\" x=\"84\" y=\"30\" width=\"16\" height=\"165\"><\u002Frect>\n        <rect fill=\"#315876\" x=\"132\" y=\"48\" width=\"16\" height=\"78\"><\u002Frect>\n        <rect fill=\"#315876\" x=\"156\" y=\"68\" width=\"16\" height=\"78\"><\u002Frect>\n        <rect fill=\"#315876\" x=\"180\" y=\"88\" width=\"16\" height=\"78\"><\u002Frect>\n        <rect fill=\"#1D314A\" x=\"108\" y=\"20\" width=\"16\" height=\"78\"><\u002Frect>\n        <rect fill=\"#1D314A\" x=\"204\" y=\"115\" width=\"16\" height=\"78\"><\u002Frect>\n        <rect fill=\"#E67E22\" x=\"108\" y=\"105\" width=\"16\" height=\"85\"><\u002Frect>\n        <rect fill=\"#E67E22\" x=\"204\" y=\"30\" width=\"16\" height=\"78\"><\u002Frect>\n        <rect fill=\"#E67E22\" x=\"228\" y=\"20\" width=\"16\" height=\"163\"><\u002Frect>\n        <rect fill=\"#E67E22\" x=\"252\" y=\"48\" width=\"16\" height=\"110\"><\u002Frect>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"hero-eyebrow\">Northern Copilot Advantage · Stage 2 · Session 3<\u002Fdiv>\n    <div class=\"hero-title\">Your role as a<br><em>data owner.<\u002Fem><\u002Fdiv>\n    <div class=\"hero-subtitle\">One specific area of your organization's information is yours to keep in good shape — so that Copilot can be trusted to work with it. Here's what that involves.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"intro-card\">\n    <strong>You don't need to be technical.<\u002Fstrong> Being a data owner means you're the person who knows whether a defined area of information is <strong>current, correct, and accessible to the right people<\u002Fstrong> — and who signs off when it's ready for Copilot. NCI supports every step.\n  <\u002Fdiv>\n\n  <div class=\"meta-row\">\n    <div class=\"meta-col\">\n      <div class=\"meta-lbl\">Handed Over At<\u002Fdiv>\n      <div class=\"meta-val\">Session 3 — AI Roadmap Planning<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"meta-col\">\n      <div class=\"meta-lbl\">Ongoing Time<\u002Fdiv>\n      <div class=\"meta-val\">~ 30–60 min per quarter<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"meta-col\">\n      <div class=\"meta-lbl\">Purpose<\u002Fdiv>\n      <div class=\"meta-val\">Trust — not perfection<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"client-row\" style=\"display:none\">\n    <div class=\"client-field\">\n      <div class=\"client-lbl\">Prepared for<\u002Fdiv>\n      <div class=\"client-line\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"client-field\">\n      <div class=\"client-lbl\">Data area you own<\u002Fdiv>\n      <div class=\"client-line\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"page-inner\">\n\n  <div class=\"definition-box\">\n    <p>A <strong>data owner<\u002Fstrong> is the person accountable for a defined area of organizational information. Not the person who created it, not the IT department — the person who knows whether it's <strong>current, correct, and accessible to the right people.<\u002Fstrong> If something in your area is wrong, stale, or in the wrong hands, you're the one who fixes it — or finds someone who can.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"section-title\">Your Four Responsibilities<\u002Fdiv>\n  <div class=\"resp-grid\">\n\n    <div class=\"resp-card\">\n      <div class=\"resp-card-header\">\n        <div class=\"resp-num\">1<\u002Fdiv>\n        <div class=\"resp-card-title\">Know what's in your area<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"resp-card-body\">\n        Understand what information your area contains and roughly where it lives — whether that's in Microsoft 365, a dedicated software system, shared drives, or somewhere else. <strong>You don't need a perfect inventory.<\u002Fstrong> You need enough familiarity to spot when something is wrong.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"resp-card\">\n      <div class=\"resp-card-header\">\n        <div class=\"resp-num\">2<\u002Fdiv>\n        <div class=\"resp-card-title\">Keep it current and accurate<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"resp-card-body\">\n        Stale, outdated, or duplicate content is a problem for Copilot — and for your team. On a regular cadence, review your area for content that should be archived, updated, or removed. <strong>NCI will provide guidance and tools to help<\u002Fstrong> where your data is in Microsoft 365.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"resp-card\">\n      <div class=\"resp-card-header\">\n        <div class=\"resp-num\">3<\u002Fdiv>\n        <div class=\"resp-card-title\">Ensure permissions are correct<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"resp-card-body\">\n        The right people should have access to your area — and the wrong people shouldn't. This is especially important before Copilot is enabled, since Copilot respects existing permissions. <strong>If permissions are wrong, Copilot's answers will be wrong.<\u002Fstrong> Review who has access at least once per cycle.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"resp-card\">\n      <div class=\"resp-card-header\">\n        <div class=\"resp-num\">4<\u002Fdiv>\n        <div class=\"resp-card-title\">Approve your area for Copilot access<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"resp-card-body\">\n        When your area has been reviewed and cleaned up, you confirm it's ready. NCI validates this with a technical check. Your sign-off matters — <strong>no owner approval, no Copilot access<\u002Fstrong> for that area. This is governance working as designed.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div class=\"page-footer\">\n    <span class=\"brand\">Northern Computer · Copilot Advantage<\u002Fspan>\n    <span>Data Owner Role<\u002Fspan>\n    <span>Page 1 of 3 · Next: your ongoing cadence<\u002Fspan>\n  <\u002Fdiv>\n  <\u002Fdiv><!-- /page-inner -->\n\n<\u002Fdiv><!-- /page 1 -->\n\n<!-- ═══════════════════════════════════════════════════════════════════════════\n     PAGE 2 — Cadence and approval flow\n═══════════════════════════════════════════════════════════════════════════ -->\n<div class=\"page\">\n\n  <div class=\"section-title\">Ongoing Maintenance Cadence<\u002Fdiv>\n  <p class=\"section-intro\">Most of the work lives in a predictable rhythm. The quarterly reviews are the spine; the on-change items are how you stay current between cycles; the annual audit is how you confirm the scope still makes sense.<\u002Fp>\n\n  <table class=\"cadence-table\">\n    <thead>\n      <tr>\n        <th>Frequency<\u002Fth>\n        <th>Task<\u002Fth>\n        <th>What to look for<\u002Fth>\n        <th>How<\u002Fth>\n      <\u002Ftr>\n    <\u002Fthead>\n    <tbody>\n      <tr>\n        <td class=\"freq\">Quarterly<\u002Ftd>\n        <td class=\"task\">Content review<\u002Ftd>\n        <td>Stale or outdated files, duplicate versions, content that should be archived or deleted<\u002Ftd>\n        <td>Walk through your area manually, or use your organization's review tools where available<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td class=\"freq\">Quarterly<\u002Ftd>\n        <td class=\"task\">Permissions review<\u002Ftd>\n        <td>People who no longer need access; missing access for current team members; external sharing that shouldn't exist<\u002Ftd>\n        <td>Review access lists with your manager or IT contact; use reporting tools where available<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td class=\"freq\">On change<\u002Ftd>\n        <td class=\"task\">Staff changes<\u002Ftd>\n        <td>New team members need access; departing staff access should be removed promptly<\u002Ftd>\n        <td>Notify your IT contact when staff changes affect your area; don't wait for the quarterly cycle<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td class=\"freq\">On change<\u002Ftd>\n        <td class=\"task\">Process changes<\u002Ftd>\n        <td>If a business process changes, the data that supports it may need to move, be renamed, or be retired<\u002Ftd>\n        <td>Flag to NCI if a major process change affects the structure of your data area<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td class=\"freq\">Annual<\u002Ftd>\n        <td class=\"task\">Full area audit<\u002Ftd>\n        <td>Is the scope of your area still accurate? Has new data been added that isn't covered? Are the right tools and people in place?<\u002Ftd>\n        <td>Review with NCI as part of the annual AI governance check-in<\u002Ftd>\n      <\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <div class=\"section-title\">Approving Your Area for Copilot Access<\u002Fdiv>\n  <p class=\"section-intro\">When your area is ready, the approval follows a simple four-step flow. Once approved, Copilot can access your area. This is the core of the Stage 3 rinse-and-repeat cycle.<\u002Fp>\n\n  <div class=\"approval-flow\">\n    <div class=\"flow-step\">\n      <div class=\"flow-step-num\">Step 1<\u002Fdiv>\n      <div class=\"flow-step-label\">You review &amp; clean up<\u002Fdiv>\n      <div class=\"flow-step-note\">Content current, permissions correct, structure tidy<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"flow-arrow\">→<\u002Fdiv>\n    <div class=\"flow-step\">\n      <div class=\"flow-step-num\">Step 2<\u002Fdiv>\n      <div class=\"flow-step-label\">You confirm it's ready<\u002Fdiv>\n      <div class=\"flow-step-note\">Your sign-off that the area meets the agreed standard<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"flow-arrow\">→<\u002Fdiv>\n    <div class=\"flow-step\">\n      <div class=\"flow-step-num\">Step 3<\u002Fdiv>\n      <div class=\"flow-step-label\">NCI validates<\u002Fdiv>\n      <div class=\"flow-step-note\">Technical check using available tools — green light or feedback<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"flow-arrow\">→<\u002Fdiv>\n    <div class=\"flow-step\">\n      <div class=\"flow-step-num\">Step 4<\u002Fdiv>\n      <div class=\"flow-step-label\">Copilot access enabled<\u002Fdiv>\n      <div class=\"flow-step-note\">For this area only — specifically and intentionally<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"section-title\">Your Area — Quick Reference<\u002Fdiv>\n  <div class=\"assignment-box\">\n    <div class=\"assignment-box-title\">Fill in at Session 3<\u002Fdiv>\n    <div class=\"assignment-fields\">\n      <div class=\"assignment-field\">\n        <label>Data area you own<\u002Flabel>\n        <div class=\"field-line\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"assignment-field\">\n        <label>Your name<\u002Flabel>\n        <div class=\"field-line\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"assignment-field\">\n        <label>Where this data primarily lives<\u002Flabel>\n        <div class=\"field-line\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"assignment-field\">\n        <label>NCI contact for your area<\u002Flabel>\n        <div class=\"field-line\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"assignment-field\">\n        <label>Priority in Stage 3 queue (Area #)<\u002Flabel>\n        <div class=\"field-line\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"assignment-field\">\n        <label>Target ready date<\u002Flabel>\n        <div class=\"field-line\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"contact-card\">\n    <strong>Questions about your role?<\u002Fstrong> Contact your NCI Account Manager — they can walk you through what your specific area involves and what tools are available for your situation. No question is too basic.\n  <\u002Fdiv>\n\n  <div class=\"page-footer\">\n    <span class=\"brand\">Northern Computer · Copilot Advantage<\u002Fspan>\n    <span>Data Owner Role<\u002Fspan>\n    <span>Page 2 of 3 · Next: your first-cycle checklist<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv><!-- /page 2 -->\n\n<!-- ═══════════════════════════════════════════════════════════════════════════\n     PAGE 3 — First-cycle checklist + notes\n═══════════════════════════════════════════════════════════════════════════ -->\n<div class=\"page\">\n\n  <div class=\"section-title\">Your First-Cycle Checklist<\u002Fdiv>\n  <p class=\"section-intro\">Work through these in order the first time around. After that, the quarterly items on page 2 become the routine.<\u002Fp>\n\n  <ul class=\"checklist\">\n    <li><span class=\"cb\"><\u002Fspan><div><strong>Confirm scope.<\u002Fstrong> With your NCI contact, agree on exactly what's in your area — and what's not.<\u002Fdiv><\u002Fli>\n    <li><span class=\"cb\"><\u002Fspan><div><strong>Locate the data.<\u002Fstrong> Note where it lives: Microsoft 365, shared drives, a line-of-business system, or a mix.<\u002Fdiv><\u002Fli>\n    <li><span class=\"cb\"><\u002Fspan><div><strong>Walk the content.<\u002Fstrong> Skim the top-level structure. Flag anything obviously stale, duplicated, or mislabelled.<\u002Fdiv><\u002Fli>\n    <li><span class=\"cb\"><\u002Fspan><div><strong>Review access.<\u002Fstrong> List who has access today. Flag anyone who shouldn't, and anyone missing.<\u002Fdiv><\u002Fli>\n    <li><span class=\"cb\"><\u002Fspan><div><strong>Check external sharing.<\u002Fstrong> Confirm any links or guest access are still needed and still correct.<\u002Fdiv><\u002Fli>\n    <li><span class=\"cb\"><\u002Fspan><div><strong>Archive or delete.<\u002Fstrong> Remove what shouldn't be there. Move what belongs elsewhere.<\u002Fdiv><\u002Fli>\n    <li><span class=\"cb\"><\u002Fspan><div><strong>Note the gaps.<\u002Fstrong> If you're not sure about something, write it down — don't guess. NCI will help resolve.<\u002Fdiv><\u002Fli>\n    <li><span class=\"cb\"><\u002Fspan><div><strong>Sign off.<\u002Fstrong> Confirm to NCI that the area meets the agreed standard and is ready for validation.<\u002Fdiv><\u002Fli>\n  <\u002Ful>\n\n  <div class=\"section-title\">Notes &amp; Questions for Your NCI Contact<\u002Fdiv>\n  <p class=\"section-intro\">Use this space during and after Session 3 — anything you want to raise, clarify, or come back to.<\u002Fp>\n  <div class=\"notes-block\">\n    <div class=\"notes-line\"><\u002Fdiv>\n    <div class=\"notes-line\"><\u002Fdiv>\n    <div class=\"notes-line\"><\u002Fdiv>\n    <div class=\"notes-line\"><\u002Fdiv>\n    <div class=\"notes-line\"><\u002Fdiv>\n    <div class=\"notes-line\"><\u002Fdiv>\n    <div class=\"notes-line\"><\u002Fdiv>\n    <div class=\"notes-line\"><\u002Fdiv>\n    <div class=\"notes-line\"><\u002Fdiv>\n    <div class=\"notes-line\"><\u002Fdiv>\n    <div class=\"notes-line\"><\u002Fdiv>\n    <div class=\"notes-line\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"page-footer\">\n    <span class=\"brand\">Northern Computer · Copilot Advantage<\u002Fspan>\n    <span>Data Owner Role<\u002Fspan>\n    <span>Page 3 of 3<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv><!-- /page 3 -->\n\n\n\n<\u002Fbody><\u002Fhtml>"

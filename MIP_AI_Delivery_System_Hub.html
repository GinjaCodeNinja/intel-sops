# Northern Copilot Advantage — Program Overview
## The whole program + how we deliver it · Start here

**Status:** Internal Working Draft v0.1 — stage names are final (Pathfinder / Outpost / Frontier / Apex); delivery details within each stage are still working drafts.
**Purpose:** The one place to get oriented. Read this first, then follow the reading order below.

---

## Start here — recommended reading order
1. **This Program Overview** — the map (you're here).
2. **The Journey Map (visual)** — the whole journey at a glance; the visual companion to this map.
3. **Kickstart** — Overview → Onboarding SOP → Delivery SOP.
4. **Pathfinder** — Overview → Onboarding → Delivery → Open Decisions. *(Pathfinder's first onboarding step is the AI Readiness Assessment.)*
5. **Outpost** — Overview → Onboarding → Delivery → Open Decisions.
6. **Frontier** — Overview → Onboarding → Delivery → Open Decisions.
7. **Apex** — Overview → Onboarding → Delivery → Open Decisions.
8. **Reference · shared tools & templates** — pull these up when a stage points to them; not meant to be read front-to-back.

*The **Consulting Delivery Model (Outpost, Frontier & Apex)** — paired with the Maturity Journey visual — is the deep dive behind the paid consulting stages; read it when you reach Outpost. Each stage opens with an **Overview** that says what the stage is and lists its deliverables.*

---

## The program at a glance
A client moves through: **Kickstart** → **Pathfinder** → **Outpost** → **Frontier** → **Apex**.
- **Kickstart** — a ~90-min intro workshop delivered from the NCA training platform; shows the value, sets safe-use basics.
- **Pathfinder (Foundation)** — starts with the **AI Readiness Assessment** (included in sign-up), then a governance managed-service: clean/govern data, activate Copilot for first users.
- **Outpost (Adoption)** — a consulting engagement: working group, monthly AI-Expert session, first agents.
- **Frontier (Scale-Readiness)** — graduates the client from Copilot to Claude + other third-party AI, gets their third-party platforms inventoried and triaged for integration, and stands up the governance groundwork an autonomous system needs before anything unattended goes live.
- **Apex (Custom Build & Optimization)** — engagement-based custom AI agent/solution development and integration, a managed digital workforce, and ongoing optimization and roadmap planning.

## The spine — one journey, two rails
Pathfinder/Outpost/Frontier/Apex are **positions** on one journey (Foundation → Adoption → Scale-Readiness → Custom Build). Underneath, two kinds of work advance together:
- **Rail A — AI Capability:** what the team can *do* with AI (fluency → workflow thinking → builds → agents).
- **Rail B — Data & Process Foundation:** getting data and processes *ready*.

Rail B **paces** Rail A; they hand off at governance **gates**. Rules that hold everywhere:
- **Copilot carries Pathfinder & Outpost; Claude + third-party AI arrive at Frontier; custom builds happen at Apex.**
- **Start anywhere, but complete the foundation as catch-up — never skip it** (tracked on a Foundation Catch-Up Backlog).
- **Attended vs. unattended** AI is the governance dividing line — autonomous ("Co-work") AI triggers a heavier gate.

## How each stage is documented
Every stage carries an **Overview** (+ its deliverables list), an **Onboarding SOP**, a **Delivery SOP**, and an **Open Decisions register**. Shared tools (pull-menu, worksheets, trackers, templates) sit in **Reference** and are drawn on across stages.

## How decisions get made
Each **Open Decisions register** feeds the **weekly coordination group**. We draft the questions and options; **the group decides and assigns** — no owners are pre-assigned in any doc.

## Pricing — one model, every stage
There's no separate price tag per stage anymore. **One AI Consulting Pricing Model** prices all paid work: a flat monthly base + a per-user fee (every M365 tenant user) + consulting time priced by the size of the client's AI consulting group and how often it meets (monthly / biweekly / weekly). What changes stage to stage is the kind of work and deliverable — not the price mechanism. Only the total monthly price is shown to the client; no line-item breakdown. **Apex custom-build engagements are scoped and quoted per SOW on top of the standing price** — the formula prices the ongoing relationship, not one-off builds ⟨confirm with the group⟩.

## Status & the live edges
Everything is a working draft. Known placeholders to develop next:
1. The **AI Readiness Assessment** process (Pathfinder's first step) — grounded in the AvePoint scan + Claude report flow; leaner than the very original plans.
2. The **Unattended AI Starter Kit** (Frontier) — safe-sandbox + governance for autonomous AI.
3. **Custom AI-integrated web apps** (Apex) — for workflows agents alone can't carry.
4. The **Kickstart SOPs** — rough drafts, to be fleshed out with the prior facilitator's delivery notes.

*Builds on existing assets: the State of Play strategy brief, the internal session design (v3), the Data Owner Role, the AUP example, the Readiness Levels handout, and the Process Map.*

<script type="text/markdown" data-doc="s1-overview">
# Kickstart — Overview
## Northern Copilot Advantage · Stage Overview

**Status:** Internal Working Draft v0.1 — names not final.
**Read this first** for Kickstart, then the Onboarding SOP and Delivery SOP.

---

## What this stage is
- **Position:** the entry point — a live introductory training workshop, before Pathfinder. Readiness **Level 1**.
- **Character:** a facilitated **~90-minute Copilot workshop** (+ a short leadership debrief) that gets people using Copilot Chat safely and shows the value first-hand.
- **Tool:** delivered via the **NCA training platform** — a browser-based facilitator app (Azure Static Web App); no local install.
- **Delivery role:** a **facilitator** (presenter). *(Historically delivered by a facilitator who is moving roles — their delivery notes will flesh these SOPs out.)*
- **Goal:** participants leave knowing what Copilot is good/bad at, can write a decent prompt, understand the ground rules, and want to do more.

## What happens
- The account manager flags an interested client; the session gets scheduled and set up in the training platform (branded to the client).
- A live workshop: how Copilot works, prompting basics, hands-on "Now You Try" exercises, debrief.
- Wrap-up: the **AI Responsible Use Pledge**, take-home assets, and a readiness-signal debrief for leadership.
- Natural lead-in to the AI Readiness Assessment / Pathfinder.

## Deliverables in this stage
| Deliverable | What it is | Status |
|---|---|---|
| **Kickstart Overview** (this doc) | Orientation + this deliverables list | Draft |
| **Kickstart Onboarding SOP** | AM handoff → scheduled & set up in the platform | Rough draft |
| **Kickstart Delivery SOP** | Running the session, cancel/reschedule, follow-ups | Rough draft |
| NCA training platform | The facilitator app the session runs from | Reference *(repo: GitHub/Northern Copilot Advantage; https://aitraining.northerncomputer.ca/)* |
| 90-minute Kickstart agenda | The workshop run-of-show | Reference *(exists)* |
| AI Responsible Use Pledge | Participant + sponsor pledge package | Reference *(complete)* |

## Hands off to
- **Pathfinder** — whose first onboarding step is the AI Readiness Assessment. The Kickstart is what makes a client want to keep going.

<script type="text/markdown" data-doc="s1-onboarding">
# Kickstart — Onboarding SOP *(rough draft)*
## For the facilitator + account manager

> **ROUGH DRAFT** — grounded in the NCA training-platform README; to be fleshed out with the current facilitator's delivery documentation. Points marked ⟨OPEN⟩ need a decision or that input.

**What this covers:** getting a Kickstart from **account-manager handoff → session scheduled, set up in the training platform, and ready to deliver.** Running the session lives in the Delivery SOP.
**Platform:** the **NCA training platform** (browser-based facilitator app). Copilot chat in the workshop is **simulated by the platform**, so participants do **not** need Copilot licenses to attend. No named owners — the weekly coordination group assigns.

---

## 1. Trigger & handoff from the account manager
- Trigger: the AM flags an interested client and requests a Kickstart.
- AM sends ahead: client/company name, approximate **headcount + roles** attending, preferred timing, any goals or sensitivities, and the primary contact. ⟨OPEN: standard intake form? → confirm with the group⟩

## 2. Info sent to the client ahead of time
- A short "what to expect" note: it's a ~90-minute hands-on session; no prep required; nothing installed on their side.
- Calendar invite with the join details and the **participant launch link** (from the platform, see §4).
- ⟨OPEN: any pre-reading or a one-pager? confirm with the facilitator's materials.⟩

## 3. Confirm logistics
- Date/time, meeting platform (Teams/Zoom), facilitator assigned.
- **Headcount check → session sizing:** if there are **too many staff for one good session**, split into **multiple sessions** (⟨OPEN: target max per session⟩). Capture whether they want role-specific groupings.

## 4. Set the session up in the training platform
Using the platform's **Prepare Customer Session** wizard:
- Select the source session plan (the standard Kickstart lesson sequence).
- Enter the **client's company name**.
- Choose a theme, or generate one with the **Customer Theme Generator** (extracts brand colors/fonts from the client's website) so slides are client-branded.
- Confirm the lesson sequence + the **welcome screen** (company name/greeting).
- Generate the **participant launch link**; if sharing any files, use **File Sharing** (set an expiry + a short message).
- ⟨OPEN: who sets this up — facilitator or a coordinator? → the group assigns.⟩

## 5. Facilitator prep
- Install the **Player as a PWA** for clean screen-sharing (no browser chrome/tabs during Teams/Zoom).
- Open **Presenter View** (speaker notes + timer) on a second screen.
- Dry-run the deck once; confirm simulated-chat slides and "Now You Try" exercises run.

## 6. Ready-to-Deliver checklist *(handoff to the Delivery SOP)*
- [ ] AM handoff received (client, headcount, timing, goals)
- [ ] Session(s) scheduled; facilitator assigned; multiple sessions booked if needed
- [ ] Session set up in the platform (company name, theme, welcome screen)
- [ ] Participant launch link (and any files) shared
- [ ] Facilitator prepped (PWA installed, Presenter View, dry-run)
- → Proceed to the **Kickstart Delivery SOP**.

## 7. Open questions *(for the facilitator's docs / the group)*
- Standard intake fields from the AM; max participants per session; any pre-reading; who owns platform setup; whether a leadership debrief is booked as part of scheduling.
</script>

<script type="text/markdown" data-doc="s1-delivery">
# Kickstart — Delivery SOP *(rough draft)*
## For the facilitator

> **ROUGH DRAFT** — grounded in the NCA training-platform README + the existing 90-minute Kickstart agenda; to be fleshed out with the prior facilitator's delivery documentation. Points marked ⟨OPEN⟩ need that input or a group decision.

**What this covers:** running the Kickstart workshop, handling cancel/reschedule and follow-ups, and the post-session wrap-up.
**Assumes onboarding is complete** — see the Kickstart Onboarding SOP (session set up in the platform, launch link shared, facilitator prepped). No named owners.

---

## 1. Run the session (~90 min)
- Deliver from the **Player** (PWA, full-screen; **Presenter View** for notes + timer).
- Agenda follows the existing **90-minute Kickstart run-of-show** *(reference the Stage 1 agenda)*. Typical beats:
  - Framing + guardrails (what this is / isn't; Copilot Chat as the safe, approved starting point).
  - How Copilot actually works (mental model; hallucinations vs. confidence).
  - How to write a good prompt (golden rules; before/after).
  - **Hands-on "Now You Try"** exercises (e.g., email drafting/refining) with the simulated-chat and exercise slides.
  - Debrief cards for discussion.
  - Close + the **AI Responsible Use Pledge**.
- ⟨OPEN: confirm the exact lesson order and timings against the facilitator's delivery notes.⟩

## 2. If they cancel or reschedule
- Reschedule the session; the platform setup (branded plan + link) is reusable, so no rebuild is needed — just confirm the new date and re-share the invite/link. ⟨OPEN: cancellation notice window / policy → group.⟩

## 3. Multiple sessions (large teams)
- Run the booked sessions in sequence; keep the same branded plan. Optionally tailor examples per audience/role group.

## 4. Follow-up session
- If the client wants a follow-up (deeper dive, more role-specific practice, Q&A), book it against the same plan; ⟨OPEN: is a follow-up included or scoped/billed? → group.⟩

## 5. Post-session wrap-up
- Deliver **take-home assets** (prompt starter pack, etc.) via the platform's **File Sharing** (expiry + message).
- Confirm the **AI Responsible Use Pledge** (participant + sponsor package).
- **Leadership readiness-signal debrief** — a short read-out to the sponsor on engagement and next steps.
- **Hand off toward Pathfinder** — tee up the AI Readiness Assessment as the next step.

## 6. Open questions *(for the facilitator's docs / the group)*
- Exact agenda/timings; cancellation policy; whether follow-ups are included vs. billed; who runs the leadership debrief; how the handoff to the Assessment is triggered.
</script>

# Pathfinder · Foundation — Overview
## Northern Copilot Advantage · Stage Overview

---

## What this stage is
- **Position:** the **Foundation** stage — the first stage after Kickstart. Readiness **Levels 1 → 3**.

- **Delivery role:** a **Pathfinder delivery lead** (governance/service).
- **Goal:** get the client's AI house in order — clean, governed data — and activate Copilot for first users.

## What happens
- Pathfinder **starts with the AI Readiness Assessment** — included in sign-up; it's the first step of Pathfinder onboarding.
- The core loop: the **workspace cleanup → Data Owner sign-off → Copilot indexing** cycle (rolling, never "done"), plus Data Owners, an AUP, and incremental Copilot activation for a pilot cohort.
- This is mostly **Rail B (Data & Process Foundation)** work (framework milestones B1–B3) + a light Rail A entry.

| Deliverable | What it is | Status |
|---|---|---|
| **Pathfinder Overview** (this doc) | Orientation + this deliverables list | Draft |
| **Pathfinder Onboarding SOP** | Sign-up → Kickoff → Report Review → Roadmap → ready | Placeholder |
| **Pathfinder AI Readiness Assessment SOP** | The assessment (scan → report → present) — Pathfinder's first step | Placeholder |
| **Pathfinder Cleanup & Activation Cycle SOP** | The rolling cleanup → sign-off → Copilot-indexing cycle | Placeholder |
| **Workspace Review Checklist** | The ~10-point owner guide for one workspace: clean / archive / exclude-from-AI, then sign off | Draft |
| **Pathfinder Open Decisions** | Probable decisions for the weekly group | Register |
| Data & Process Readiness Tracker | Rail B progress + the B3 sign-off log | Reference (shared tool) |
| Data Owner Role · AUP example · Process Map | Governance assets reused at Pathfinder | Reference *(Stage 2 assessment set)* |

## Hands off to
- **Outpost** — when Outpost-readiness is "earned" (enough workspaces signed off, active Copilot use, appetite for agents). Pathfinder's cleanup cycle keeps running underneath Outpost.

<script type="text/markdown" data-doc="framework">
# The AI Consulting Delivery Model
## Outpost, Frontier & Apex — the fractional AI-expert engagement, end to end

**Status:** Internal Working Document — Draft v0.4
**Purpose:** Define what the **AI Consulting** component of the Northern Copilot Advantage (NCA) offering actually delivers — the hands-on path NCI leads a client down once they're past the foundation, through Copilot fluency, into agents, automation, and (at Frontier) Claude and third-party AI, with custom builds and ongoing optimization at Apex, while their data and process foundation keeps maturing underneath.
**Audience:** NCI delivery staff (the "fractional AI expert" role). A lighter client-facing view is produced separately (the Journey Map visual).
**Scope:** the **Outpost, Frontier, and Apex** consulting stages only. This is *not* the whole-program map.
**v0.4 changes:** renames Walk/Run/Fly to **Pathfinder/Outpost/Frontier**; splits the former Fly scope into **Frontier** (tool graduation + integration readiness + governance groundwork) and a new **Apex** stage (custom build, managed digital workforce, ongoing optimization/roadmap planning); reflects the single **AI Consulting Pricing Model** that now prices all paid work, replacing separate per-stage pricing.

---

## Where this sits
- **The whole program** (Kickstart → Pathfinder → Outpost → Frontier → Apex, both rails, the core principles) lives in the **Program Overview** — that's the map. Read it first.
- **Kickstart** (the intro workshop) and **Pathfinder** (the Foundation governance managed-service) each have their **own Overview + SOPs** — this document does *not* cover their delivery.
- **This document is the delivery model for the paid consulting stages — Outpost, Frontier & Apex.** It goes deepest there because that's where the AI-capability work concentrates. The whole-journey visual companion is the Journey Map.

---

## 1. What this is, and why it exists
Kickstart teaches people that AI is useful. Pathfinder — starting with the AI Readiness Assessment — makes their environment safe and gets Copilot activated for first users. **This model picks up from there:** the Outpost → Frontier → Apex part where a client moves from "we've tried Copilot and we like it" to "AI is changing how we work."

It fills three gaps flagged as *not written* in the May 2026 State of Play: the Outpost service description, the fractional expert's monthly session format, and the declarative-agent support scope. It is the **curriculum and delivery layer** underneath the Outpost stage's `AI Adoption & Analytics` and `Task Automation` MI components, extending into Frontier and Apex.

### The core stance
The client is the domain expert; NCI is the guide. A 150-person engineering firm knows its own workflows, its own pain, and its own opportunities far better than we ever will. Our job is not to tell them what to automate — it's to **give them a safe way to discover it themselves, a language to reason about it, and the guardrails to do it without getting hurt.** They will find uses we would never have thought of. We make sure they find them safely and can tell which ones are worth keeping.

This is the consult-construct model applied to discovery: **we advise, structure, and de-risk; the client explores, decides, and owns.**

### The design principle: spine + pull-menu
- The **spine** is a loose progression — a suggested path from fluency to automation. It is a *default suggestion, not a gate.*
- The **pull-menu** is a catalog of experiments the client's working group draws from whenever they want. This is what lets them "discover what lands" rather than sit through a course.

Structure is available on demand, never imposed.

---

## 2. How this fits the existing NCA frameworks
This is **not a fourth framework.** It is the delivery layer under the three that already exist. One story, three views:

| Existing framework | Role | This framework's relationship |
|---|---|---|
| **AI Readiness Levels 1–5** | Client-facing maturity axis | Each rail milestone maps to a Level |
| **Pathfinder / Outpost / Frontier / Apex** | Customer-journey stages | The journey lives mostly in Outpost, extends into Frontier and Apex |
| **9-component Managed Intelligence Model** | Capability building blocks | The two rails *are* the curriculum that builds those components |

> **Coordinate, don't pre-empt:** the MI Model component design (State of Play Decision 5) is still an open NCI design session. This framework is an **input** to that session, not a competing definition.

**Naming discipline:** stage names (Pathfinder / Outpost / Frontier / Apex) are decided. Rail/milestone names below remain working, outcome-language placeholders — no client-facing name below the stage level is final until marketing signs off.

---

## 3. The two rails
A client matures along **two different axes at once**:
- **Rail A — AI Capability:** how well the client understands and *uses* AI. (Fluency → workflow thinking → builds → agents.)
- **Rail B — Data & Process Foundation:** how well the client understands and *manages their own data and processes*.

**Rail B is the enabler and the rate-limiter of Rail A.** You cannot safely build on data nobody has organized, and you cannot connect AI to systems nobody has inventoried.

### The rails meet at the governance gates
| Rail B milestone reached… | …unlocks in Rail A |
|---|---|
| Workspace cleaned & signed off (B3) | Builds/experiments on that data (Stage 4, standard gate) |
| Core process documented 20/80 (B4) | Meaningful Workflow Thinking + automation (Stage 3–4) |
| Third-party app inventoried & triaged (B5–B6) | Extend & Orchestrate / integrations (Stage 6); unattended work (heavier gate) |

### Terminology (keep these straight)
- **Rails** = the two kinds of *work* (A: AI Capability, B: Data & Process). They answer *"what are we doing?"*
- **Pathfinder / Outpost / Frontier / Apex** = the client's *position* (Foundation → Adoption → Scale-Readiness → Custom Build). They answer *"how far have we gotten?"* Same journey — they can't conflict.
- **Tool** = Copilot is the spine tool for Pathfinder/Outpost; Claude and other third-party AI enter at Frontier (§5); custom builds happen at Apex.

### The journey aligns to Pathfinder / Outpost / Frontier / Apex
| Band | Character | Rail B — Data & Process | Rail A — AI Capability | Readiness Level |
|---|---|---|---|---|
| **Pathfinder** · Foundation | Foundation-heavy | Know your data · Source of truth & owners · Clean & sign off (ongoing) | Foundations · Copilot Fluency | 1 → 3 |
| **Outpost** · Adoption | Capability-heavy | Document core processes (20/80) | Workflow Thinking · First Builds · Prove & Productionize | 4 |
| **Frontier** · Scale-Readiness | Integration-readiness on both rails | Inventory platforms · Assess integrations | Claude + third-party AI arrives | 5 |
| **Apex** · Custom Build & Optimization | Build & operate on both rails | Integration triage acted on | Extend & Orchestrate · custom agents/solutions · ongoing optimization | 5+ |

**Start anywhere — but complete the foundation as catch-up, never skip it.** Entering high changes the *starting position*, not the *required foundation*. Enforced two ways — (1) **the gates don't care what stage you bought into**; and (2) an explicit per-client **Foundation Catch-Up Backlog** keeps the outstanding basics visible.

---

## 4. Rail A — The Spine (AI Capability)
- **A1 — Foundations:** basic AI literacy, prompting, safe-use mindset (Stage 1 Kickstart). Level 1.
- **A2 — Copilot Fluency:** real daily value — recall, summaries, drafting. Most ROI is here. Pathfinder→Outpost · Level 3–4.
- **A3 — Workflow Thinking:** see work as steps; AI vs. code vs. human. Depends on B4. Outpost · Level 4.
- **A4 — First Builds:** guided experiments; simple declarative agents (Copilot Studio). Builds on real data need B3. Outpost · Level 4.
- **A5 — Prove & Productionize:** a landed experiment becomes a supported build; graduation gate. Outpost→Frontier · Level 5.
- **A6 — Extend & Orchestrate:** Claude arrives and integration readiness is assessed at Frontier; MCP, multi-agent, and unattended AI get built at Apex once B5–B6 and the heavier gate are in place. Frontier→Apex · Level 5+.
  - *On the radar (placeholder):* agents alone don't always carry a workflow — some need a **custom AI-integrated web app**. Apex capability; approach TBD (§14, Apex Open Decisions §J).

---

## 5. The tool sequence: Copilot first, Claude at Frontier
**Copilot is the spine tool for Pathfinder and Outpost; Claude + other third-party AI (ChatGPT, xAI) arrive at Frontier.** Deliberate sequencing.

**Why (internal rationale — keep out of client copy):** Copilot carries the early journey because it's the familiar tool already in their day. That concentrates early learning-curve friction on Copilot, so Claude lands as a step-change — *it feels like magic* — at Frontier. Client copy says only *"build skills on Copilot, then graduate to Claude and advanced AI."*

**The exception:** some clients arrive already using Claude and jump to Frontier or Apex. That changes position, not foundation — they still complete Pathfinder/Outpost basics as catch-up.

---

## 6. Rail B — Data & Process Foundation
- **B1 — Know where your data is** (kicks off in the Assessment).
- **B2 — Source of truth & ownership** (Data Owner role made real).
- **B3 — Clean & sign off workspaces** *(rolling — never "done")*: sign off *some*, proceed; it unlocks Rail A one workspace at a time.
- **B4 — Name & document core processes (20/80)**: feeds Workflow Thinking (A3).
- **B5 — Inventory third-party platforms & their data.**
- **B6 — Assess integration readiness** (MCP / API / native / none yet + consent).

> **Watch the scope on B4.** Core processes only, 20/80 depth, AI-relevant first. Don't boil the ocean.

---

## 7. Attended vs. unattended AI — the governance dividing line
| | Attended AI | Unattended / autonomous AI |
|---|---|---|
| Definition | A human reviews each output | Acts across steps without per-step review |
| Risk | Contained | Elevated — errors compound |
| Gate | Standard | **Heavier gate** |
| Home | Stages A2–A4 · Pathfinder/Outpost · Copilot | Stages A5–A6 · Frontier prepares, Apex builds · Claude & third-party |

---

## 8. The Pull-Menu (experiment catalog)
The deck the working group draws from — see the Experiment Cards. Category · Level · Track · Prereqs (incl. which gate) · what it teaches · what "good" looks like.

## 9. Governance gates
- **Standard gate** — before any experiment touches real data: workspace owned & signed off (B3), permissions correct, outputs human-reviewed.
- **Heavier gate** — before any unattended use: bounded scope, named human owner, kill switch, monitoring, blast-radius note, signed-off data only. Third-party requires B6 triage.

## 10. The Emerging Capabilities lane
A permanent intake owned by the fractional expert: sandbox → govern → adopt/park/reject → fold survivors into the deck. Uses the New Capability Evaluation. Turns "keeping up" into a repeatable service.

## 11. The Fractional AI Expert role
Guide, not driver. Consult-construct. The monthly session tracks both rails; the Experiment Log → monthly ROI story counters the "lose exec buy-in in the boring months" failure mode.

## 12. The Working Group operating model
Light structure: sponsor · champions · rotating testers. A short working-group meeting between our sessions. A shared backlog (Rail A experiments + Rail B items + any catch-up backlog). It should run itself from the guides + pull-menu.

## 13. Where to find everything (index)
Deliverables are indexed in this **Hub sidebar** and in each stage's **Overview** page — use those as the live index (this framework no longer keeps a static file list). Shared tools live in the Hub's **Reference** section.

## 14. Open items to resolve
- Feed into the MI Model design session (Decision 5).
- Session-format review; final naming below the stage level (defer to marketing); Claude safe-config handoff (Stage 2 governance).
- Rail B ↔ Stage 2/Pathfinder overlap — reference, don't duplicate.
- **Unattended AI starter kit** — develop from placeholder.
- **Custom AI-integrated web apps (placeholder)** — develop an approach (stack, hosting, build/maintain, pricing).
- **Apex SOW pricing vs. the AI Consulting Pricing Model** — confirm custom-build engagements are quoted per SOW on top of the standing formula-priced relationship, not folded into it.
</script>

<script type="text/markdown" data-doc="session">
# Fractional AI Expert — Monthly Session Format
## AI Discovery Journey — Outpost Stage Delivery

**Status:** Internal Working Draft v0.1
**Purpose:** Give the monthly advisory hour (Outpost stage) a consistent, repeatable shape so it's easy to sell and easy to deliver as the team scales. Fills the monthly-consulting-session-format gap from the May 2026 State of Play.
**Model:** Consult-construct. We advise, design, and de-risk. The client explores, decides, and owns.

---

## The standing shape (~60 min)
| Beat | Time | What happens |
|---|---|---|
| **1. What landed** | ~15 min | Walk the Experiment Log. Capture the one-sentence win for leadership. |
| **2. Unblock** | ~15 min | Whatever they're stuck on — a prompt, an agent, "AI or just a macro?" |
| **3. What's next** | ~15 min | Suggest the next few experiment cards; coach the concept. |
| **4. One new thing** | ~10 min | The standing **Emerging Capabilities** item. |

Close by confirming what the group will try next and whether anything waits on a gate.

## Per-stage emphasis
- **Copilot Fluency:** Beat 3 dominates — drive daily-use habits before chasing agents.
- **Workflow Thinking:** run a **Workflow Deconstruction** live; teach the triage. Highest-leverage session.
- **First Builds:** Beats 1 & 2 dominate; keep experiments small; celebrate throwaways.
- **Prove & Productionize:** scope a productionization; run the **graduation gate**.
- **Extend & Orchestrate:** design integrations/agents; run the **heavier gate** for anything autonomous.

## The Emerging Capabilities standing item
One "here's something new" segment each session, sourced from our own **New Capability Evaluation** work — we bring a verdict, not just news. Survivors become new experiment cards.

## Deliverables from each session (lightweight)
Updated Experiment Log roll-up · the one-sentence leadership win · agreed next experiments · any gate actions · notes in the client record (outcome language).

## Add-on hours
Additional recurring advisory hours are priced the same way as the standing consulting time — through the **AI Consulting Pricing Model**'s $200/hr consulting rate, not a separate add-on number. Same four-beat shape; deeper builds are where extra hours or Apex-stage scoping come in.

<script type="text/markdown" data-doc="cards">
# Experiment Cards — The Pull-Menu
## AI Discovery Journey — Working Group Deck

**Status:** Internal Working Draft v0.1
**How to use:** The working group pulls a card whenever they want to try something. Pick by curiosity, time available, or what you want to learn. Most experiments are throwaways — that's the point. Log what landed.

---

## Card format
- **Category** — Create · Find & Recall · Analyze · Automate · Agent · Integrate
- **Level** — Explore (~15 min) · Build (~half-day) · Advanced (multi-session)
- **Track / stage** — Copilot cards carry the early journey (**Pathfinder/Outpost**); Claude and other third-party-AI cards are a **Frontier** capability; any unattended experiment is a **Frontier** evaluation, and any custom build is an **Apex** capability
- **Prereqs** — tool/license needed, and **⚠ Gate** if it touches real company data or runs unattended
- **What it teaches** — the concept behind the activity
- **What "good" looks like** — how to tell it worked

---

## Starter deck

### C1 · Draft an image for a proposal
- **Category:** Create · **Level:** Explore · **Track:** Either
- **Prereqs:** Copilot/Designer or Claude; no real data → no gate
- **What it teaches:** how generative tools take direction, and where they're strong vs. weak.
- **What good looks like:** a usable concept image + you can say *why* a second prompt got a better result.

### C2 · Find that thing you half-remember
- **Category:** Find & Recall · **Level:** Explore · **Track:** Copilot
- **Prereqs:** full Copilot license; real M365 data → **⚠ standard gate**
- **What it teaches:** Copilot as org memory.
- **What good looks like:** found in one query what would've taken 10 minutes of folder-digging.

### C3 · Turn a meeting into action items
- **Category:** Find & Recall · **Level:** Explore · **Track:** Copilot
- **Prereqs:** Copilot in Teams; internal meeting → **⚠ standard gate**
- **What it teaches:** summarization + extraction; prompt for *decisions and owners*.
- **What good looks like:** the summary is send-ready and caught a decision you'd have forgotten.

### C4 · Analyze a spreadsheet
- **Category:** Analyze · **Level:** Build · **Track:** Either
- **Prereqs:** Copilot in Excel or Claude with an upload; non-sensitive export first, real data → **⚠ standard gate**
- **What it teaches:** AI as analyst — and the discipline of *checking* its claims.
- **What good looks like:** an insight you'd have missed, and you verified one number by hand.

### C5 · Ask questions of a long document
- **Category:** Analyze · **Level:** Explore · **Track:** Claude **(Frontier)**
- **Prereqs:** Claude Project; upload a spec/contract → **⚠ standard gate** if real
- **What it teaches:** long-context reasoning grounded in a specific source.
- **What good looks like:** a cited answer from *your* document, not a generic one.

### C6 · Build a simple Q&A agent
- **Category:** Agent · **Level:** Build · **Track:** Copilot
- **Prereqs:** Copilot Studio; one clean, signed-off site → **⚠ standard gate**
- **What it teaches:** the anatomy of a declarative agent — demystifies "agents."
- **What good looks like:** a colleague got a correct, sourced answer to a real question.

### C7 · Write a reusable prompt for a recurring task
- **Category:** Automate · **Level:** Explore · **Track:** Either
- **What it teaches:** the first step of automation — a repeated ad-hoc request becomes a reliable, shareable prompt.
- **What good looks like:** two people ran it and got consistent, useful output.

### C8 · Deconstruct one real workflow
- **Category:** Automate · **Level:** Build · **Track:** Either
- **Prereqs:** the Workflow Deconstruction worksheet
- **What it teaches:** *the* core skill — break a task into steps and tag each rules/judgment/human.
- **What good looks like:** you found one step to automate and one that must stay human.

### C9 · Try an autonomous / "Co-work"-style task *(safe sandbox only)*
- **Category:** Agent · **Level:** Advanced · **Track:** Either **(Frontier — unattended)**
- **Prereqs:** sandbox, dummy data only → **⚠ heavier gate**
- **What it teaches:** what unattended AI can/can't do, and why the bar is higher.
- **What good looks like:** you can answer — could we run this safely, and is it useful enough to govern?

### C10 · Compare Copilot vs Claude on the same task
- **Category:** Analyze · **Level:** Explore · **Track:** Copilot + Claude **(Frontier)**
- **What it teaches:** the two tools have different strengths; choosing is a skill.
- **What good looks like:** you can say which you'd reach for next time, and why.

---

## Adding cards
New cards come from experiments the group invents (log and formalize winners) and the **Emerging Capabilities lane**. The deck is meant to grow.
</script>

# Pathfinder — Onboarding SOP *(placeholder)*
## AI Discovery Journey · Pathfinder Stage (Foundation) · For the Pathfinder delivery lead

**Status:** Internal Working Draft v0.1 — **placeholder.** `⟨PENDING → Register §X⟩` items await the weekly group. No named owners.
**What this covers:** setup from **Pathfinder sign-up → ready for the cleanup cycle.** Pathfinder starts with the **AI Readiness Assessment** (its own SOP), included in sign-up. Onboarding then sets up governance and hands off to the **Cleanup & Activation Cycle SOP**.

> **A 3-session shape** (adapted from the internal session design v3; "executive sessions" branding dropped). **Cadence ⟨PENDING → Register §J1 — group to confirm⟩:** Kickoff → [Assessment] → Report Review → Roadmap Planning.

## 1. Purpose & boundary
Get a client from *signed up* to *ready for the cycle*. Pathfinder is **Rail B foundation** (B1–B3) + light Copilot activation. Target: Readiness **Level 3**.

## 2. Trigger & sign-up
Client signs up for **Pathfinder**; the AI Readiness Assessment is the first thing Pathfinder does ⟨→ Register §A2 (Decided)⟩. Confirm contact + exec sponsor.

## 3. Session 1 — Kickoff *(~45–60 min)*
- **The Three Questions:** (1) what should Copilot access? (default → intentional access) · (2) what's your source of truth per area? · (3) does each area have an owner who *knows it*?
- **Vocabulary Bridge:** name the report's four terms — Information Scope · Source of Truth · Data Ownership · Shadow AI / AUP.
- **Reflection Guide:** hand over the short between-sessions guide (reuse `MIP_Reflection_Guide_BetweenSessions.html`). Introduce Readiness Levels 1–3 ("a starting line, not a grade").

## 4. The AI Readiness Assessment runs
See **`MIP_Pathfinder_AI_Readiness_Assessment_SOP.md`** (AvePoint scan → Claude report → present). Its output feeds Sessions 2–3.

## 5. Session 2 — Report Review *(~30–45 min)*
Reactions first, then a plain-language findings walk (governance gaps, "who gets Copilot first," source-of-truth, ROT/risk, current Level). Nothing to decide today; confirm Session 3.

## 6. Session 3 — Roadmap Planning *(~60–90 min, working session)*
- **Scope table:** per area — in scope for Copilot? / data in M365? (non-M365 → separate integration discussion, ties to Rail B B5–B6 / Frontier).
- **Name the Data Owners** (registry): **one per workspace/area**; for client-facing sites, often the **AM / service lead**. *"No owner, no access"; "an owner who doesn't know they're an owner is not an owner."* ⟨assignment process → §L9, §C1⟩
- **Prioritize the first workspaces** — **top 5–10** high-value ones; AI off for the rest until signed off.
- **Copilot licensing:** pilot-cohort seats ⟨→ §E1, §E2⟩.
- **AUP handover:** ask "what would be completely unacceptable?", then hand over the **example-only** AUP (*not legal advice — use your own counsel*). Deliverables: Data Owner registry · first-workspace priority · example AUP · Data Owner one-pager.

## 7. Provisioning & governance tooling
Configure **AvePoint Workspace Management/Elements** for the cycle (Data Owner tracking, workspace health, sign-off workflow) ⟨→ §F1⟩; tenant access; named admin + Data Owners confirmed. **Set the tenant governance baseline:** AI access **default-OFF** (RCD off across sites) ⟨→ §L1, §L2⟩; **restrict site/group creation** to curb sprawl + decide who holds site-restriction control ⟨→ §L3, §L8⟩; **client comms** that uncontrolled site/group creation (and deleting groups) risks data loss.

## 8. Open tracking
Open the readiness tracker (B3 sign-off log). Record in IT Glue / SharePoint list / spreadsheet.

## 9. Ready-for-Cycle checklist
- [ ] Kickoff done (three questions, vocabulary bridge, reflection guide)
- [ ] Assessment run & report presented
- [ ] Roadmap done: scope table, Data Owner registry, first workspaces prioritized
- [ ] AUP handed over (example-only); pilot Copilot licenses assigned
- [ ] AvePoint governance configured; tracker open
- → Proceed to the **Cleanup & Activation Cycle SOP**.

## 10. Flags
- ⟨**FUTURE — group**⟩ "Your AI Advantage" exec-productivity beat — back-burnered for go-to-market.
- *Provenance:* adapted from the session design **v3**, de-branded; dropped as legacy: "executive sessions" / "Stage 2–3" language, the proposal/sale motion, persona/mortgage examples; PIPEDA omitted.

<script type="text/markdown" data-doc="pathfinder-cleanup">
# Pathfinder — Cleanup & Activation Cycle SOP *(placeholder)*
## AI Discovery Journey · Pathfinder Stage (Foundation) · For the Pathfinder delivery lead

**Status:** Internal Working Draft v0.1 — **placeholder.** EOS-style. `⟨PENDING⟩` items → the Pathfinder register.
**What this covers:** the ongoing, post-onboarding **cleanup → sign-off → Copilot-indexing cycle** + incremental activation. (The assessment + governance setup happen first, in the Onboarding SOP.)
**Delivery role:** role-neutral "Pathfinder delivery lead" ⟨→ Register §B1⟩. **Pathfinder is a governance managed-service** — no AI-Expert monthly session (that's Outpost).
**Assumes onboarding complete** (assessment presented, Data Owners, AUP, AvePoint configured, pilot licensed, first workspace picked).
**One-line job:** run the workspace cleanup cycle so Copilot has clean, governed data — and activate Copilot for first users as workspaces sign off.

## 1. The Pathfinder cycle *(core loop — rolling, never "done")*
> **Default-OFF:** AI access starts **off for every workspace** (Restricted Content Discovery off across all sites — set at Onboarding §7); the cycle turns it on one signed-off workspace at a time. Tool-agnostic (also gates Claude/ChatGPT/search). ⟨toggling at scale needs a tool → §L1, §L2⟩

1. **SELECT** the next workspace — start with the **top 5–10** high-value ones ⟨→ §D1⟩
2. **REVIEW & clean** — Data Owner works the **Workspace Review Checklist** (clean / archive / exclude-from-AI) ⟨delete vs archive → §D2, §L10⟩
3. **SIGN-OFF** — Data Owner attests it's current, permissioned, safe ⟨→ §D3⟩
4. **ENABLE** — **lift the AI-access restriction (RCD) for that workspace, recorded as an audit trail** (who/when); Copilot indexing follows ⟨→ §L1⟩
5. **Repeat.** Track pace ⟨→ §D4⟩

## 2. Data quality
Remove ROT; a useful filter is **files not opened in ~4 years**. Use a **non-indexed "versions archive"** for superseded files. For swamps, **stand up a new clean site and move only good data (old site → archive)**; separate **working vs. published** at site/library level so AI sees only the clean set. **Retiring a Teams/group workspace? Archive, don't delete** (deleting kills channel history). **Archive by default; delete only after a backup is confirmed** — the Data Owner's call ⟨→ §D2, §L8, §L10⟩.

## 3. Copilot activation & basic support
Activate pilot users incrementally as workspaces sign off. **Sharpen relevance (Copilot):** mark the **authoritative library** + use a **Status metadata column** so Copilot prioritizes current docs *(Copilot-only, not Claude)* ⟨→ §L6⟩. Basic Copilot Chat support (prompt help, day-to-day) ⟨scope → §E4⟩. Light user enablement ⟨reuse Kickstart? → §E3⟩.

## 4. AvePoint health monitoring
Keep workspace health/automation running; watch for new risk/ROT/over-sharing ⟨who/cadence → §F1, §F2⟩. **Permission-report caveat:** verify vs. actual site + security-group config (inheritance, sharing links); library-level views are weak today ⟨→ §L4, §L5⟩.

## 5. Cadence & touchpoints
Scheduled check-in vs. reactive ⟨→ §B2⟩. Working assumption: a light monthly progress review.

## 6. Progress reporting *(beat the "unglamorous months" risk)*
Each period, show **workspaces signed off** and **value unlocked**, in outcome language ⟨format → §G1⟩.

## 7. Watch for Outpost-readiness *(the "earned" trigger)*
Signals: enough workspaces signed off, active/eager Copilot use, exec engaged, appetite for agents. Raise Pathfinder→Outpost ⟨→ §G2; align with Outpost B1⟩.

## 8. Tracking
Keep the B3 sign-off log current ⟨who → §G3⟩. Notes in the client record.

## 9. Boundaries (consult-construct)
**Do:** run the cycle, advise, process sign-offs, enable indexing, basic Copilot help. **Don't:** make the client's ownership/deletion calls, build agents, do workflow consulting or Claude/third-party (Outpost/Frontier), or guarantee outcomes.

## 10. Roles, coverage & escalation
Who processes sign-offs / enables indexing ⟨§B3⟩; capacity ⟨§H1⟩; coverage + escalation ⟨§H2⟩.

## 11. Exit / graduation to Outpost
When Outpost-readiness holds, hand to the **Outpost onboarding**. Pathfinder's cleanup keeps running underneath.
</script>

<script type="text/markdown" data-doc="workspace-review">
# Workspace Review Checklist
## Reviewing one workspace before AI is switched on

**Status:** Internal Working Draft v0.1 — from the AvePoint field test; refine with data-owner feedback.
**Who / job:** a **Data Owner** (with NCI) reviews **one** SharePoint site / Teams workspace and decides **clean up · archive · exclude from AI** — then signs off.
**Pairs with:** the Data Owner Role + the Cleanup & Activation Cycle SOP (REVIEW → SIGN-OFF → ENABLE).

> **Start here:** AI access is **off** for this workspace until you sign off — nothing here is exposed to Copilot (or Claude / ChatGPT / search) while you review.

## The 10-point review
1. **What is this workspace for — still active?** If dead, likely *archive + exclude from AI* → skip to 9.
2. **Who should have access vs. who can?** Watch **old "anyone with the link" sharing links, broken inheritance, and security-group membership** — the automated report doesn't always show the real state.
3. **One authoritative version, or duplicates/old copies?** Decide the source of truth.
4. **Old files → archive or delete?** Starting filter: **not opened in ~4 years.** Archive what's irrelevant; **delete only after a backup is confirmed;** when in doubt, archive.
5. **Sensitive/restricted content to exclude from AI entirely?** Mark it to stay excluded.
6. **Working vs. published data — separate them?** So AI sees only the clean/published set (site/library-level control).
7. **Current & accurate enough to trust AI answers on?** If stale/contradictory, clean first.
8. **Sharpen relevance (Copilot):** mark the **authoritative library** + a **Status metadata column** (Current / Superseded / Draft). *(Copilot-only, not Claude.)*
9. **Make the call:** clean in place · move clean data to a new site (old → non-indexed archive) · exclude from AI for now.
10. **Sign off → NCI enables AI access (recorded).** Your sign-off attests it's current, correctly permissioned, and safe; NCI lifts the restriction for this workspace only and **records the decision** (who / when).

*Draft note: from NCI's first hands-on AvePoint run; expect it to tighten as data owners use it. Open supporting questions (report accuracy, granular views, non-Copilot scoping) → `MIP_Pathfinder_Open_Decisions.md` §L.*
</script>

Confirm Copilot licensing — **every working-group member needs a full Copilot license** (per-seat cost scales with group size; the AI Consulting Pricing Model's consulting-hours term also scales with the size of this group). Access agreed ⟨→ §I3⟩. Note the client's Claude/third-party status (supported Claude work is a Frontier item).

## 5. Stand up the working group
Roles: **sponsor**, one or two **champions**, rotating **testers**. Agree size/coverage ⟨→ §I4⟩. **Licensing prerequisite:** seats assigned before the first experiments. Give the group its cadence, a shared backlog, and the **pull-menu**. Client-facing working-group guide/lesson? ⟨→ §I5, §I6⟩

## 6. Set up tracking & records
Open the readiness tracker + experiment log (who keeps it ⟨→ §F1⟩). Record location: IT Glue / SharePoint list / spreadsheet.

## 7. Run the Kickoff *(last step of onboarding)* ⟨shape → §C1, §C2⟩
Attendees: sponsor, champions, AI Expert, AM. Agenda (~45–60 min): where they are (Journey Map) · what Outpost is · confirm the working group · pick the **first focus** · set the recurring session ⟨→ §D1⟩. Output: a short "here's our plan" recap.

## 8. Set cadence & booking
Default monthly; note accelerated/bi-weekly (route per Delivery §7 / §D3). Create the recurring invite; confirm owner ⟨→ §D1⟩.

## 9. Ready-for-Delivery checklist
- [ ] Commercial signed; entry path agreed
- [ ] Governance minimum OR catch-up backlog opened
- [ ] Sponsor + champion named; working group stood up
- [ ] Every member has a Copilot license assigned
- [ ] Tracker + log open; first focus picked; cadence booked
- → Proceed to **Delivery SOP §4 (Session 1)**.

## AI Discovery Journey · Outpost Stage · For the AI Expert

**Status:** Internal Working Draft v0.1 — **placeholder.** EOS-style. `⟨PENDING → Register §X⟩` items → the Outpost register.
**Stance:** Consult-construct — we don't make business decisions, own operations, or guarantee outcomes.
**One-line job:** turn an Outpost client's working group into people who use Copilot well, think in workflows, and safely build their first agents — while the data foundation catches up.

## 1. Purpose & who this is for
The playbook for the **ongoing** Outpost engagement (post-onboarding). **Assumes onboarding complete** (working group, tracking, first focus, cadence). Pairs with the 4-beat session format, the framework, the tracker, and the cards.

## 2. Precondition — client is onboarded
Intake, sign-off, provisioning, working group, cadence all happen in the Onboarding SOP. Confirm its **Ready-for-Delivery checklist** before Session 1.

## 3. Kickoff → handled in Onboarding
The kickoff is the last step of onboarding. Delivery begins at **Session 1 (§4)**.

## 4. Where we start — Session 1 ⟨default → §C3⟩
Copilot fluency baseline · frame with the two framing questions (from the Pathfinder kickoff) · stand up the pull-menu · pick 1–2 starter experiments. If further along: jump to a Workflow Deconstruction.

## 5. The monthly rhythm *(core loop)*
Run the **4-beat session** every time (what landed · unblock · what's next · one new thing). Apply per-stage emphasis. Close by agreeing next steps + flagging any gate.

## 6. Default first-90-days arc *(template — easy to deviate)* ⟨→ §C4⟩
- **Session 1:** fluency baseline + working group + first experiments.
- **Session 2:** review; run a Workflow Deconstruction; introduce the triage.
- **Session 3:** first guided build on governed data; measure it.
- Thereafter: iterate — productionize what lands.

## 7. Cadence variations
Monthly (default) · accelerated/bi-weekly = a bigger consulting-hours term in the same pricing formula, priced automatically by frequency ⟨→ §D3⟩ · extra hours booked at the model's $200/hr rate ⟨→ §D4⟩ · quiet client = nudge sequence then flag AM ⟨→ §D5⟩.

## 8. Build & agent work
Included vs. billable line ⟨→ §E1⟩ · who builds (AI Expert light, else PS/dev) ⟨→ §E2⟩ · gate routing (sandbox + fast-track ungoverned data; never build on un-signed-off real data) · **Unattended / Claude / third-party = Frontier**, not Outpost.

## 9. Tracking & reporting
Keep the experiment log current ⟨→ §F1⟩ · update the tracker · a monthly one-page ROI summary ⟨format → §F2⟩ · notes in the client record.

## 10. Boundaries (consult-construct)
**Do:** advise, design, coach, de-risk, unblock, suggest, sandbox. **Don't:** make business decisions, own operations, approve AI outputs, or guarantee outcomes ⟨→ §E3⟩.

## 11. Roles & handoffs
AM ↔ AI Expert (warm-lead in; relationship/renewal out) ⟨→ §A2, §G4⟩ · AI Expert ↔ PS/dev ⟨→ §E2⟩ · a single AI Expert owns each client ⟨→ §G2⟩ · named backup ⟨→ §G3⟩ · escalation ⟨→ §G4⟩.

## 12. Exit / graduation to Frontier
Signals: mature Copilot use, wants Claude/third-party/integrations, first agents valued. Raise Outpost→Frontier ⟨→ §F3⟩; run the graduation gate for anything going to production.

<script type="text/markdown" data-doc="frontier-onboarding">
# Frontier — Onboarding SOP *(placeholder)*
## AI Discovery Journey · Frontier Stage (Scale-Readiness) · For the AI Expert

**Status:** Internal Working Draft v0.1 — **placeholder.** EOS-style. `⟨PENDING → Register §X⟩` items await the weekly group.
**What this covers:** setup to graduate a client's toolset to **Frontier** (Claude + third-party AI, integration readiness, unattended-AI governance groundwork). Frontier is **engagement-based** on a **continuing Outpost base**, and hands bespoke build work to Apex.
**Stance:** Consult-construct — the client approves, owns, and is accountable for what goes to production.

## 1. Purpose & boundary
Get a client Frontier-ready: tools graduated, integrations mapped, governance stood up. Frontier = Rail A A6 entry + Rail B B5–B6; Readiness **Level 5**.

## 2. Trigger & entry
Outpost client hits **Frontier-readiness** (mature Copilot, agents valued, wants Claude/third-party/integration, has an LOB system to connect) ⟨→ §A1⟩. **Confirm the Outpost base continues** ⟨→ §A3⟩.

## 3. Confirm the foundation is real *(highest-stakes work so far)*
Governance minimum in place; data/workspaces in scope are **signed off** (B3). If not, open the **Foundation Catch-Up Backlog** — Frontier does not build on ungoverned data.

## 4. Complete the integration map
Complete the **Integration Inventory** (B5) + **connection triage** (B6) for the systems in scope ⟨→ §C1⟩. Per system: native → vetted vendor MCP → community → custom; note the consent path ⟨→ §C2, §C3⟩.

## 5. Set up Claude & third-party AI *(safely)*
Claude safe-configuration (Stage 2 governance) before real use ⟨→ §E1⟩ · confirm licensing/seats ⟨→ §E2⟩ · support scope ⟨→ §E3⟩.

## 6. Stand up autonomous-agent governance *(before anything unattended, so Apex has ground to build on)*
The **heavier gate** + AI Operations basics: registry · approval workflow · monitoring · kill switches · a named human owner per agent ⟨tooling → §D2; owner → §D4⟩. Confirm the sandbox-first unattended path ⟨→ §D1, §D3⟩.

## 7. Ready-for-Apex checklist
- [ ] Outpost base confirmed and continuing
- [ ] Data/workspaces in scope signed off (or catch-up backlog opened)
- [ ] Integration inventory + triage complete
- [ ] Claude/third-party configured safely + licensed
- [ ] Autonomous-agent governance stood up (registry, approval, monitoring, kill switch, owner)
- → Hand off to the **Apex Onboarding SOP** to scope the first build engagement.

*Cross-stage:* Frontier stacks on Outpost (and Pathfinder beneath) — nothing turns off. A jumped-in client still owes the foundation via the catch-up backlog; §3 enforces it.

<script type="text/markdown" data-doc="apex-delivery">
# Apex — Delivery SOP *(placeholder)*
## AI Discovery Journey · Apex Stage (Custom Build & Optimization) · For the AI Expert + build team

**Status:** Internal Working Draft v0.1 — **placeholder.** EOS-style. `⟨PENDING⟩` items → the Apex register.
**Assumes onboarding complete** (Frontier handoff confirmed, first engagement scoped).
**Three things run at once:** (1) **engagements** — scoped builds (integrations, custom/autonomous agents, **custom AI-integrated web apps** — placeholder); (2) **operations** — the managed digital workforce (monitoring, lifecycle); and (3) **ongoing optimization & roadmap planning** — a standing review of what's live and what's next. All on a continuing Outpost + Frontier base.

## 1. The engagement loop *(per initiative)*
1. **Scope** (SOW) ⟨→ §I1⟩
2. **Design** — AI Expert designs; client approves.
3. **Build** — the build resource builds ⟨→ §B1⟩
4. **Gate** — attended → standard gate; **unattended → heavier gate** (bounded scope · named owner · kill switch · monitoring · blast-radius note · signed-off data only) ⟨→ §D1⟩
5. **Deploy** — release; register it.
6. **Verify & hand over** — confirm it works; confirm the client owner accepts accountability ⟨→ §D4⟩

## 2. Integration work (MCP / API / native)
Work from the Integration Inventory triage completed at Frontier. Vet connectors (native → vetted vendor MCP → community → custom); **security review before real data** ⟨→ §C2⟩. Confirm consent/approval + document the data flow ⟨→ §C3⟩.

## 3. Managed digital workforce *(ongoing operations)*
Keep an agent/integration **registry** ⟨→ §F3, §G2⟩ · **monitor** for drift/failures ⟨→ §D2, §F1⟩ · **failure response** (alert → response → kill switch → root-cause) ⟨→ §F2, §H1⟩ · lifecycle (update/retire).

## 4. Ongoing optimization & roadmap planning *(standing thread — not one-off)*
On the agreed cadence (Apex Onboarding §5): review what's live, what needs tuning, what's underused, and what the client should build next. Feeds the client's roadmap the same way the Experiment Log feeds Outpost's ROI story ⟨format → §F2⟩.

## 5. Unattended / "Co-work"-class AI
Uses the heavier gate stood up at Frontier — sandbox-first (dummy data) → usefulness rubric → real use ⟨→ §D3⟩. Many autonomous tools should fail the usefulness test cheaply — a good outcome.

## 6. Claude & third-party AI
Uses the Claude safe-config stood up at Frontier ⟨→ §E1⟩; support scope per what's agreed ⟨→ §E3⟩.

## 7. Emerging capabilities
New connectors/agents/features flow through the New Capability Evaluation; survivors become candidate engagements.

## 8. Progress & reporting
Per-engagement outcome report ⟨format → §G1⟩ + ongoing operations status (health, incidents) + the optimization/roadmap review, outcome language.

## 9. The Outpost + Frontier base continues
Apex is additive — the Outpost monthly hour, declarative-agent support, and Frontier's tool/governance groundwork keep running. Don't let an Apex build eclipse that momentum.

## 10. Boundaries (consult-construct)
**Do:** design, build, integrate, govern, monitor, advise, optimize. **Don't:** own the client's decisions, approve production autonomy for them, or guarantee outcomes. A named **client** owner is accountable for each production agent.

## 11. Roles, coverage & escalation
Build resourcing/capacity ⟨→ §B2, §H2⟩; production-failure coverage/escalation ⟨→ §H1⟩ — higher stakes than Outpost.

## 12. Exit / steady state
No "graduation up" — Apex is the top of the journey. Steady state = a growing, well-governed digital workforce plus a standing optimization/roadmap rhythm, Frontier + Outpost + Pathfinder intact beneath it. North star: *"they manage our intelligence infrastructure."*
</script>

<script type="text/markdown" data-doc="dataowner">
# Your Role as a Data Owner
## What it means, what it involves, and what happens next

> **Lives in:** `MIP_Data_Owner_Role.html` — the polished, client-facing handout (+ its printable twin). This is the readable in-hub copy.
>
> *Note: the styled `.html` handout (+ printable) predates the recent field-test additions below (the ~4-year review filter, the "AI stays off until you sign off" wording, the Workspace Review Checklist pointer) and needs a matching refresh in a later design pass.*

*This handout predates the current program naming — "Stage 2" ≈ the Pathfinder AI Readiness Assessment; "Session 3 · AI Roadmap Planning" ≈ the Pathfinder onboarding roadmap session; "Stage 3 rinse-and-repeat" ≈ the Pathfinder Cleanup & Activation Cycle. Kept faithful to the styled original it links to.*

**The short version:** You've been named as a data owner. That means one specific area of your organization's information is yours to keep in good shape — so that Copilot can be trusted to work with it. Ongoing commitment: **~30–60 min per quarter.**

## What a data owner is
A **data owner** is the person accountable for a defined area of organizational information. Not the person who created it, not the IT department — the person who knows whether it's **current, correct, and accessible to the right people.** If something in your area is wrong, stale, or in the wrong hands, you're the one who fixes it — or finds someone who can.

## What this role is NOT
- A full-time job or a new title
- An IT role — you don't need to be technical
- Responsibility for data you don't already know
- Liability for historical decisions you didn't make
- A solo job — NCI supports the process
- Something that needs to be perfect before it starts

## Your four responsibilities
1. **Know what's in your area.** Understand what information your area contains and roughly where it lives — Microsoft 365, a dedicated software system, shared drives, or elsewhere. You don't need a perfect inventory; you need enough familiarity to spot when something is wrong.
2. **Keep it current and accurate.** Stale, outdated, or duplicate content is a problem for Copilot — and for your team. On a regular cadence, review your area for content that should be archived, updated, or removed. A practical starting point: **files not opened in ~4 years** — archive what's no longer relevant, keep what still matters (delete only once a backup is confirmed). NCI provides guidance and tools where your data is in Microsoft 365.
3. **Ensure permissions are correct.** The right people should have access — and the wrong people shouldn't. This matters especially before Copilot is enabled, since **Copilot respects existing permissions. If permissions are wrong, Copilot's answers will be wrong.** Watch for access that's broader than you intend — **old "anyone with the link" sharing links, inherited permissions, and access people get through a security group.** Review who has access at least once per cycle.
4. **Approve your area for Copilot access.** When your area has been reviewed and cleaned up, you confirm it's ready. NCI validates with a technical check. **AI stays off for your area until you sign off** — and every activation is **recorded**, so there's a clear trail of what was approved, by whom, and when. Your sign-off matters: **no owner approval, no Copilot access** for that area. This is governance working as designed.

> **When you sit down to review a workspace,** work through the **Workspace Review Checklist** (`MIP_Workspace_Review_Checklist.md`) with NCI — a short guide that walks you from "what is this and who should see it?" to a clean/archive/exclude decision and sign-off.

## Ongoing maintenance cadence
> *Facilitator note (internal): the specific tools per step depend on where the client's data lives. For data in Microsoft 365, AvePoint provides structured reporting for steps 1–3. Outside M365, review is manual or tool-dependent. Tailor this per client.*

| Frequency | Task | What to look for | How (generic) |
|---|---|---|---|
| Quarterly | Content review | Stale/outdated files, duplicate versions, content to archive or delete | Walk your area manually, or use your org's review tools |
| Quarterly | Permissions review | People who no longer need access; missing access for current team; external sharing that shouldn't exist | Review access lists with your manager/IT; use reporting tools where available |
| On change | Staff changes | New members need access; departing staff access removed promptly | Notify your IT contact when staff changes affect your area — don't wait for the quarterly cycle |
| On change | Process changes | If a business process changes, its data may need to move, be renamed, or retired | Flag to NCI if a major process change affects your data area |
| Annual | Full area audit | Is the scope still accurate? New data not yet covered? Right tools and people in place? | Review with NCI at the annual AI governance check-in |

## Approving your area for Copilot access
When your area is ready, approval follows a simple four-step flow. Once approved, Copilot can access your area. This is the core of the ongoing cleanup cycle.

1. **You review & clean up** — content current, permissions correct, structure tidy.
2. **You confirm it's ready** — your sign-off that the area meets the agreed standard.
3. **NCI validates** — technical check using available tools; green light or feedback.
4. **Copilot access enabled** — for this area only, specifically and intentionally.

## Your area — quick reference *(filled in at the roadmap session)*
- Data area you own
- Your name
- Where this data primarily lives
- NCI contact for your area
- Priority in the cleanup queue (Area #)
- Target ready date

*Questions about your role? Contact your NCI Account Manager — no question is too basic.*

<script type="text/markdown" data-doc="levels">
# AI Readiness Levels
## What they mean and where you're going

> **Lives in:** `MIP_Readiness_Levels_Handout.html` — the polished, client-facing handout. This is the readable in-hub copy.

*This handout predates the current program naming — "Stage 2" ≈ the Pathfinder AI Readiness Assessment. Kept faithful to the styled original it links to.*

Before we look at your assessment results, it helps to understand the framework used to score them — and what you're building toward.

> *Facilitator note: walk through this before revealing the client's level. The goal is to normalize Level 1 and make Level 3 feel achievable — not far off. This framing should land before any number is shown.*

## The framing
NCI assesses Copilot readiness on a **five-level scale.** Each level reflects how well your Microsoft 365 environment is organized, governed, and secured — and what Copilot can safely do for your team at that stage.

**Level 1 is the normal starting point** — it simply means the environment hasn't been organized with AI in mind yet. Most organizations are here. The question isn't where you are today — it's how quickly you can get to **Level 3**, and what needs to happen to get there.

## The five levels
1. **Ready to Start** — Your Microsoft 365 environment works well for daily use, but it hasn't been organized with AI in mind yet. Some cleanup and governance work is needed before Copilot can operate safely. *The most common starting point.*
2. **Building the Foundation** — Core security is strong and the foundational work is underway: establishing who owns what, how documents should be organized, and the rules for sharing and access. Copilot is the near-term goal.
3. **Ready to Pilot** *(activation target)* — Your environment meets the baseline requirements for responsible Copilot use. A pilot group can activate and begin using Copilot in their daily work. **This is what the readiness work is designed to reach.**
4. **Copilot Active** *(comes next)* — Copilot is live for the full organization. Your team is trained, usage is monitored, and the environment is maintained to support continued AI use.
5. **Optimizing for AI** *(comes next)* — Copilot is embedded in how your team works. The focus shifts to automation, deeper workflows, and expanding what AI contributes to the business.

## What Level 3 unlocks — the activation milestone
At Level 3, a pilot group can activate Microsoft 365 Copilot and begin using it in daily work. The consistently highest-value use cases for leadership teams:

- Summarize email threads
- Recap missed meetings with action items
- Draft documents and communications
- Search intelligently across your files

## Copilot status at each level
| Level | Copilot status | What becomes available |
|---|---|---|
| 1 — Ready to Start | Not yet activated | — |
| 2 — Building the Foundation | Not yet — preparing | Groundwork underway; user training may begin |
| 3 — Ready to Pilot | **Pilot group active** | Summarize emails · recap meetings · draft documents & communications · intelligent file search |
| 4 — Copilot Active | All users | Full Copilot in Outlook, Teams, Word, Excel · meeting notes · AI-assisted document review |
| 5 — Optimizing for AI | Full capability | Copilot Pages · workflow automation · custom AI agents |

## Pace
Getting from **Level 1 to Level 3 is achievable in 8–10 weeks.** The rate-limiting factor is not technical — it's organizational. Decisions about who owns which information, how it should be classified, and what your AI policy will say require input from your leadership team. **NCI facilitates, drafts, and configures. You make the decisions.**
</script>

# A Few Things to Think About Before We Meet Again
## Between-Sessions Reflection Guide

> **Lives in:** `MIP_Reflection_Guide_BetweenSessions.html` (+ its printable twin) — the polished client handout. This is the readable in-hub copy.

*This handout predates the current program naming — "Stage 2 / Your AI Advantage / Session 1 → Session 2" ≈ the Pathfinder onboarding **Kickoff → Report Review**. Kept faithful to the styled original it links to.*

**Use this:** after the Kickoff, before the Report Review. ~20–30 minutes, whenever suits. **Jot notes — there are no wrong answers.** It's not a form to fill in correctly — it's a set of questions worth sitting with before the assessment results arrive, so that when they do you're already thinking in the right direction. These are the questions only **you** can answer.

## 1. What would you NOT want Copilot to be able to read?
Boundaries are easier to define than access — files, conversations, or information that feel off-limits, sensitive, or simply not relevant. *No wrong answers.* (e.g., HR files, compensation, client-sensitive material, exec email threads.)

## 2. Where does time disappear in your week?
The tasks that repeat, the questions asked over and over, the work that shouldn't need a human. Just think about friction — that's where Copilot tends to help most.

## 3. Who do your people go to for "the real answer" about something?
Every org has informal sources of truth — who knows where the current version lives, who has the final say. **These people are often your natural data owners.**

## 4. Who should be responsible for keeping each area's information in good shape?
A name or role is enough; "unsure" is useful too.

| Area | Likely owner (name/role) | Confident? |
|---|---|---|
| Sales & Business Dev | | Y / unsure |
| Client & Account Mgmt | | Y / unsure |
| Operations & Delivery | | Y / unsure |
| Finance & Accounting | | Y / unsure |
| People & HR | | Y / unsure |
| Other | | Y / unsure |

## 5. What's your biggest concern about AI in your business — be honest?
The real one, not the polished one — staff reaction, data privacy, compliance exposure, or not knowing what you don't know. **The Report Review is a better conversation when we know what's on your mind.**

## 6. How will you know this was worth it? What does success look like in 6 months?
A gut check, not a KPI exercise. If it went well, what would you tell your future self changed — what got easier? (e.g., less admin time, a 2-minute briefing on any client file, a clear policy nobody's worried about.)

Bring them to the Report Review — or just bring your thoughts; there's nothing to submit. The assessment tells us what your environment looks like technically; these notes tell us what matters to **you** as a leader.
